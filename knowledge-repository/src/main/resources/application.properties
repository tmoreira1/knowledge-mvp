spring.application.name=knowledge-repository
server.port=${SERVER_PORT:8080}

# ---- Datasource (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knowledge_mvp}
spring.datasource.username=${DB_USER:knowledge}
spring.datasource.password=${DB_PASSWORD:knowledge}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Flyway owns the schema; Hibernate only validates the entity mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway ----
spring.flyway.enabled=true
# Existing DBs already have the 8 tables: baseline at V1 so it is treated as
# already-applied and skipped. A fresh empty DB skips baseline and runs V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ---- RabbitMQ ----
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Fail fast on publish when broker is down so we can swallow it (best-effort).
spring.rabbitmq.template.retry.enabled=false

knowledge.events.exchange=knowledge.events

# ---- OpenAPI / Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
